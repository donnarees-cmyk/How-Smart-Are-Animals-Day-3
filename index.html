<script>
/* ============ CONTENT ============ */
const KEY_SVG = c => `<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="20" cy="22" r="13" fill="none" stroke="${c}" stroke-width="7"/><path d="M29 31 L54 56 M44 46 L50 40 M49 51 L55 45" stroke="${c}" stroke-width="7" stroke-linecap="round"/></svg>`;

const PLOT_SVG = `<div style="overflow-x:auto"><svg viewBox="0 0 640 230" style="width:100%;min-width:480px;max-width:100%;height:auto" role="img" aria-label="Plot diagram mountain">
<polyline points="20,190 150,190 330,40 470,150 620,150" fill="none" stroke="#2c7be5" stroke-width="6" stroke-linejoin="round"/>

<text x="30" y="215" font-size="17" fill="#1b2240" font-weight="700">1. Exposition</text>
<text x="168" y="135" font-size="17" fill="#1b2240" font-weight="700" transform="rotate(-38 168 135)">2. Rising Action</text>
<text x="290" y="22" font-size="17" fill="#1b2240" font-weight="700">3. Climax</text>
<text x="400" y="80" font-size="17" fill="#1b2240" font-weight="700">4. Falling Action</text>
<text x="480" y="178" font-size="17" fill="#1b2240" font-weight="700">5. Resolution</text>
</svg></div>`;

const PAGE = {key:"ll-hsa-day3-v1", day:"Day 3", title:"How Smart Are Animals?",
  intro:"Today you'll find the controlling idea of a science article, sort the four types of evidence authors use, and master spelling words with the f sound.",
  standards:["ELA.6.R.2.2 Central idea","ELA.K12.EE.1.1 Cite evidence","ELA.6.V.1.1 Academic vocabulary","ELA.6.C.3.1 Conventions & spelling"],
  checklist:["Jane Goodall Project","Jane Goodall Planner","How Smart Are Animals? Vocabulary","IXL A.1"]};
const GROUPS = [{g:"all", title:"Today's Locks", note:"Go in order from Lock 1 to Lock 4."}];
const SMART = {title:"Many Kinds of Smart",lines:[
 "Scientists once thought that only humans could think, plan, and solve problems, but research now shows that many animals are smart in their own ways.",
 "For example, crows on the island of New Caledonia bend twigs into hooks to pull insects out of logs.",
 "A border collie named Chaser learned the names of more than 1,000 toys and could fetch each one when asked.",
 "Dolphins and Asian elephants have recognized themselves in mirrors, a skill that very few animals have shown.",
 "Scientist Irene Pepperberg, who worked with an African grey parrot named Alex for about 30 years, reported that Alex could name colors, shapes, and numbers of objects.",
 "Each animal's intelligence fits the way it lives, so today many scientists ask not just \"How smart is this animal?\" but \"How is this animal smart?\""]};
const STATIONS = [
{ id:"central", std:["ELA.6.R.2.2"], g:"all", color:"#3f9b3a", title:"Central Idea", blurb:"Find the controlling idea",
  learn:[
   {h:"The controlling idea", html:`<p>The <span class="term">central idea</span> is the most important point the author makes about the topic. In a science article, it's often called the <span class="term">controlling idea</span> because it <b>controls</b> everything else. Every paragraph supports it.</p>
   <ul><li>Look in the <b>introduction</b>. Science articles often state the controlling idea early.</li><li>Check the <b>conclusion</b>. It often restates it in a new way.</li><li>Test it: does it fit the <b>whole</b> article?</li></ul>`},
   {h:"Central idea vs. details", html:`<ul><li><b>Central idea</b> = the umbrella</li><li><b>Supporting evidence</b> = the raindrops under the umbrella</li></ul>
   <div class="tip">If a sentence is only about <b>one</b> animal or <b>one</b> study, it's probably a detail, not the central idea.</div>`}
  ],
  example:{q:`Topic: octopuses. Which is the central idea? (A) "An octopus once opened a jar in an aquarium." (B) "Octopuses are clever problem-solvers that can learn, explore, and escape."`,a:`<b>(B)</b> is the central idea. It covers the big point. (A) is one example that supports it.`},
  passage:SMART,
  qs:[
   {t:"tap",d:1,q:"Tap the sentence that states the <b>controlling idea</b>.",a:0,hint:"Check the introduction. Which sentence covers ALL the animals?",why:"The first sentence states the big idea: many animals are smart in their own ways. Every other sentence supports it."},
   {t:"mc",d:2,q:"Which statement BEST describes the central idea of the whole passage?",opts:["Crows use tools.","Chaser the dog knew many toy names.","Many different animals show intelligence in ways that fit how they live.","Dolphins like mirrors."],a:2,hint:"Which choice fits every paragraph?",why:"This choice covers all the animals and matches the introduction and conclusion."},
   {t:"mc",d:2,q:"How does the last sentence connect to the controlling idea?",opts:["It introduces a brand-new topic.","It restates the idea that animals are smart in different ways.","It argues that animals are not smart.","It lists the animals again."],a:1,hint:"Compare the first and last sentences.",why:"The conclusion restates the controlling idea in a new way: each animal is smart in its own way."},
   {t:"mc",d:2,q:"Which detail does NOT support the central idea?",opts:["Crows bend twigs into hooks.","Alex the parrot could name colors and shapes.","Some parrots have gray feathers.","Elephants recognized themselves in mirrors."],a:2,hint:"Which detail says nothing about being smart?",why:"Gray feathers don't show intelligence, so that detail doesn't support the central idea."}
  ]},
{ id:"evidence", std:["ELA.6.R.2.2", "ELA.K12.EE.1.1"], g:"all", color:"#2a9d8f", title:"Four Types of Evidence", blurb:"Facts, statistics, examples & experts",
  learn:[
   {h:"How authors support the controlling idea", html:`<ul>
   <li><span class="term">Facts</span>: statements that can be proven true. <i>Dolphins are mammals.</i></li>
   <li><span class="term">Statistics</span>: facts that use <b>numbers</b> or data. <i>Chaser learned more than 1,000 toy names.</i></li>
   <li><span class="term">Examples</span>: specific cases that show the idea. Often starts with <i>for example</i> or <i>such as</i>.</li>
   <li><span class="term">Expert quotations or opinions</span>: what a scientist or expert says or reports about the topic.</li></ul>
   <div class="tip"><b>Quick sort:</b> a number? → statistic. A scientist's words or findings? → expert. "For example…" → example. Can be proven? → fact.</div>`},
   {h:"Why use different types?", html:`<p>Using different types of evidence makes an article <b>stronger</b> and more convincing.</p>
   <ul><li>Statistics make evidence <b>measurable</b>.</li><li>Examples help readers <b>picture</b> the idea.</li><li>Experts add <b>trust</b>.</li><li>Facts give readers solid information that can be checked.</li></ul>`}
  ],
  example:{q:`"About 9 out of 10 pet owners say their pets understand their feelings." What type of evidence?`,a:`A <b>statistic</b>. It uses numbers (9 out of 10) as data.`},
  passage:SMART,
  qs:[
   {t:"tap",d:1,q:"Tap the sentence that uses a <b>statistic</b>.",a:2,hint:"Look for a number used as data.",why:"'More than 1,000 toys' is a number, so that's a statistic."},
   {t:"tap",d:1,q:"Tap the sentence that gives an <b>example</b> and starts with a signal phrase.",a:1,hint:"Look for 'For example.'",why:"'For example' introduces the crow example."},
   {t:"tap",d:2,q:"Tap the sentence that uses an <b>expert</b> as evidence.",a:4,hint:"Who is a scientist reporting her findings?",why:"Irene Pepperberg is a scientist who studied Alex for years. Her report is expert evidence."},
   {t:"mc",d:2,q:"Sentence 4, about dolphins and elephants recognizing themselves in mirrors, is mainly which type of evidence?",opts:["fact","expert quotation","statistic","opinion"],a:0,hint:"It can be proven true, and it doesn't use numbers or a person's words.",why:"It's a fact that has been proven in studies, with no numbers or quotes."},
   {t:"mc",d:2,q:"Why did the author include evidence from a scientist who studied Alex for about 30 years?",opts:["to make the article funnier","to add trust, because she is an expert with lots of experience","to give a number","to change the topic"],a:1,hint:"Think about ethos from our persuasion lesson.",why:"A scientist with 30 years of experience is trustworthy, which makes the evidence stronger."},
   {t:"mc",d:2,q:"How does the statistic about Chaser support the controlling idea?",opts:["It proves crows use tools.","It gives a measurable number that shows a dog can be smart in its own way.","It tells where border collies come from.","It is an expert quotation."],a:1,hint:"What does the number 1,000 show about Chaser?",why:"Learning more than 1,000 toy names is measurable proof that dogs are smart in their own way."}
  ]},
{ id:"fsound", std:["ELA.6.C.3.1"], g:"all", color:"#d64f8a", title:"Word Study: The f Sound", blurb:"f, ff, ph & gh",
  learn:[
   {h:"Four ways to spell the f sound", html:`<div class="chips">
   <div class="chip"><b>f</b>: fish, fact, scientific</div>
   <div class="chip"><b>ff</b>: giraffe, cliff, effect, sniff</div>
   <div class="chip"><b>ph</b>: dolphin, elephant, phenomenon, photograph</div>
   <div class="chip"><b>gh</b>: laugh, tough, enough, rough</div></div>
   <ul><li><b>ph</b> often shows up in science words from Greek: <i>phone</i> (sound), <i>photo</i> (light), <i>graph</i> (write).</li>
   <li><b>gh</b> usually makes the f sound at the <b>end</b> of a word, after <i>ou</i> or <i>au</i>: tough, laugh.</li>
   <li><b>ff</b> often comes after a short vowel: cliff, stuff, sniff.</li></ul>`}
  ],
  example:{q:`How do you spell the animal: e _ _ phant or e l e f a n t?`,a:`<b>elephant.</b> The f sound in elephant is spelled <b>ph</b>. Many animal and science words use ph: dolphin, elephant, phenomenon.`},
  qs:[
   {t:"mc",d:1,q:"Which word is spelled correctly?",opts:["dolfin","dolphin","dollfin","dolghin"],a:1,hint:"This science animal word uses ph.",why:"Dolphin uses ph for the f sound."},
   {t:"mc",d:1,q:"In which word does <b>gh</b> make the f sound?",opts:["night","ghost","enough","daughter"],a:2,hint:"Say each word out loud. Which one ends with an f sound?",why:"In enough, gh says f. In night and daughter, gh is silent, and in ghost it says g."},

   {t:"mc",d:2,q:`Choose the correct spelling: "The scientist took a ______ of the crow using its stick tool."`,opts:["fotograph","photograf","photograph","photograff"],a:2,hint:"Both f sounds in this word use the same spelling.",why:"Photograph uses ph twice: photo (light) + graph (write)."},
   {t:"mc",d:2,q:`Choose the correct spelling: "The hike up the ______ was ______."`,opts:["clif / ruff","cliff / rough","cliph / rough","cliff / ruph"],a:1,hint:"Cliff has a short vowel. Rough ends with ou + gh.",why:"Cliff uses ff after a short vowel, and rough uses gh after ou."},
   {t:"mc",d:1,q:"Which word does NOT have the f sound?",opts:["giraffe","laugh","through","fact"],a:2,hint:"Say each word aloud.",why:"In through, gh is silent. Giraffe, laugh, and fact all have the f sound."}
  ]},
{ id:"exit", std:["ELA.6.V.1.1", "ELA.6.R.2.2", "ELA.6.R.2.1"], g:"all", color:"#e09f1f", title:"Exit Ticket", blurb:"Show what you know",

const STD = {"ELA.6.R.1.1": {"h": "Literary Elements", "t": "Analyze how the interaction between characters contributes to the development of a plot in a literary text."}, "ELA.6.R.1.2": {"h": "Theme", "t": "Analyze the development of stated or implied theme(s) throughout a literary text."}, "ELA.6.R.1.3": {"h": "Perspective and Point of View", "t": "Explain the influence of multiple narrators and/or shifts in point of view in a literary text."}, "ELA.6.R.1.4": {"h": "Poetry", "t": "Describe the impact of various poetic forms on meaning and style."}, "ELA.6.R.2.1": {"h": "Structure", "t": "Explain how individual text sections and/or features convey meaning in texts."}, "ELA.6.R.2.2": {"h": "Central Idea", "t": "Analyze the central idea(s), implied or explicit, and its development throughout a text."}, "ELA.6.R.2.3": {"h": "Purpose and Perspective", "t": "Analyze authors' purpose(s) in multiple accounts of the same event or topic."}, "ELA.6.R.2.4": {"h": "Argument", "t": "Track the development of an argument, identifying the types of reasoning used."}, "ELA.6.R.3.1": {"h": "Figurative Language", "t": "Explain how figurative language contributes to tone and meaning in text(s)."}, "ELA.6.R.3.2": {"h": "Paraphrasing and Summarizing", "t": "Paraphrase content from grade-level texts."}, "ELA.6.R.3.3": {"h": "Comparative Reading", "t": "Compare and contrast how authors from different time periods address the same or related topics."}, "ELA.6.R.3.4": {"h": "Understanding Rhetoric", "t": "Identify rhetorical appeals in a text."}, "ELA.6.V.1.1": {"h": "Academic Vocabulary", "t": "Integrate academic vocabulary appropriate to grade level in speaking and writing."}, "ELA.6.V.1.2": {"h": "Morphology", "t": "Apply knowledge of Greek and Latin roots and affixes to determine meanings of words and phrases in grade-level content."}, "ELA.6.V.1.3": {"h": "Context and Connotation", "t": "Apply knowledge of context clues, figurative language, word relationships, reference materials, and/or background knowledge to determine the connotative and denotative meaning of words and phrases, appropriate to grade level."}, "ELA.6.C.1.4": {"h": "Expository Writing", "t": "Write expository texts to explain and/or analyze information from multiple sources, using a logical organizational structure, relevant elaboration, and varied transitions."}, "ELA.6.C.3.1": {"h": "Conventions", "t": "Follow the rules of standard English grammar, punctuation, capitalization, and spelling appropriate to grade level."}, "ELA.K12.EE.1.1": {"h": "Cite Evidence", "t": "Cite evidence to explain and justify reasoning."}, "ELA.K12.EE.2.1": {"h": "Comprehend Complex Texts", "t": "Read and comprehend grade-level complex texts proficiently."}};
function stdBox(s){ if(!s.std) return ""; return `<div class="stdbox no-read"><span class="lbl">Florida B.E.S.T. Grade 6 Standards</span>${s.std.map(c=>`<p><b>${c} · ${STD[c].h}:</b> ${STD[c].t}</p>`).join("")}</div>`; }
/* ============ STATE (autosaves on this device) ============ */
const SAVE_KEY = PAGE.key;
let S = {name:"", view:"home", st:0, step:0, ans:{}, celebrated:{}, finale:false, check:{}};
function load(){ try{ const raw = localStorage.getItem(SAVE_KEY); if(raw){ S = Object.assign(S, JSON.parse(raw)); } }catch(e){} }
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
load();

const PRAISE = ["Way to go!","You unlocked it!","Brilliant thinking!","Nailed it!","Locksmith level up!","You're on fire!","Super reader move!","Fantastic!","Yes! Great job!","You've got the key!"];
const RETRY = ["So close! You've got this.","Good try! Use the hint and try again.","Keep going, every locksmith tries more than one key!"];
const pick = a => a[Math.floor(Math.random()*a.length)];

function stepsFor(st){
  const s = STATIONS[st], out=[];
  s.learn.forEach((l,i)=>out.push({kind:"learn",i}));
  if(s.example) out.push({kind:"example"});
  s.qs.forEach((q,i)=>out.push({kind:"q",i}));
  out.push({kind:"done"});
  return out;
}
const qid = (st,i)=>STATIONS[st].id+"-"+i;
function stationDone(st){ return STATIONS[st].qs.every((q,i)=>S.ans[qid(st,i)] && S.ans[qid(st,i)].status); }
function points(){ let p=0; Object.values(S.ans).forEach(a=>{ if(a.status==="right")p+=10; else if(a.status==="second")p+=5; else if(a.status==="written")p+=10; else if(a.status==="missed")p+=2; }); return p; }
function updateScore(){ document.getElementById("scoreNum").textContent = points(); }

/* ============ READ ALOUD (Google US English voice) ============ */
let VOICE=null;
function pickVoice(){ try{ const v = speechSynthesis.getVoices(); VOICE = v.find(x=>x.name==="Google US English") || v.find(x=>x.lang==="en-US" && /Google/.test(x.name)) || v.find(x=>x.lang==="en-US") || null; }catch(e){} }
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(el){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const clone = el.cloneNode(true); clone.querySelectorAll(".no-read,svg,.speak,textarea,.starters,.nav").forEach(n=>n.remove());
  let txt = clone.innerText.replace(/ELA\.[A-Z0-9.]+/g,"").replace(/[🔑⭐🎉✨🔊]/g,"").replace(/\s+/g," ").trim();
  const u = new SpeechSynthesisUtterance(txt); if(VOICE) u.voice=VOICE; u.lang="en-US"; u.rate=.95;
  speechSynthesis.speak(u);
}
function stopSpeak(){ try{ speechSynthesis.cancel(); }catch(e){} }

/* ============ CELEBRATION ============ */
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1800); }
function popConfetti(){ if(window.confetti) confetti({particleCount:70,spread:70,origin:{y:.75},colors:["#f2b705","#2a9d8f","#e76f51","#7b4fd6","#2c7be5"]}); }
function bigConfetti(){ if(!window.confetti) return; const end=Date.now()+2200; (function f(){ confetti({particleCount:6,angle:60,spread:60,origin:{x:0}}); confetti({particleCount:6,angle:120,spread:60,origin:{x:1}}); if(Date.now()<end) requestAnimationFrame(f); })(); confetti({particleCount:160,spread:110,origin:{y:.6}}); }

/* ============ RENDER ============ */
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function go(view,st,step){ stopSpeak(); S.view=view; if(st!==undefined)S.st=st; if(step!==undefined)S.step=step; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); }

function render(){
  updateScore();
  if(!S.name){ return renderWelcome(); }
  if(S.view==="station") return renderStation();
  if(S.view==="finale") return renderFinale();
  renderHome();
}

function renderWelcome(){
  app.innerHTML = `<section class="hero"><h1>${PAGE.title}<br>${PAGE.day}</h1><p>${PAGE.intro} Unlock ${STATIONS.length} locks to earn your golden keys. Your answers save on this iPad, so you can leave and come right back.</p></section>
  <div class="card" style="--c:#2a9d8f"><h3>Welcome, Locksmith!</h3><p>Type your first name to start your key ring.</p>
  <form class="name-row" id="nameForm"><input type="text" id="nameIn" autocomplete="off" placeholder="First name" aria-label="First name"><button class="btn" type="submit">Start →</button></form></div>`;
  document.getElementById("nameForm").addEventListener("submit",e=>{e.preventDefault(); const v=document.getElementById("nameIn").value.trim(); if(!v){toast("Type your name first!");return;} S.name=v.slice(0,30); save(); popConfetti(); toast("Welcome, "+S.name+"!"); render();});
}

function stdHTML(){ return `<div class="stds no-read"><b>Florida B.E.S.T. Standards:</b> ${[...new Set(STATIONS.flatMap(x=>x.std||[]))].map(c=>`<span>${c} ${STD[c].h}</span>`).join("")}</div>`; }
function checkHTML(){ if(!PAGE.checklist.length) return ""; S.check=S.check||{}; return `<div class="card due" style="--c:#c2416b;margin-bottom:18px"><h3>✅ Due Today</h3><p>Check off each one when it's turned in.</p>${PAGE.checklist.map((c,i)=>`<label class="duerow"><input type="checkbox" id="due${i}" data-i="${i}" ${S.check[i]?"checked":""}> <span>${c}</span></label>`).join("")}</div>`; }
function wireChecks(){ document.querySelectorAll(".due input").forEach(cb=>cb.onchange=()=>{ S.check[cb.dataset.i]=cb.checked; save(); if(cb.checked){ toast(pick(PRAISE)); popConfetti(); } if(PAGE.checklist.every((c,i)=>S.check[i])){ bigConfetti(); toast("Everything turned in! 🎉"); } }); }
function renderHome(){
  const doneCount = STATIONS.filter((s,i)=>stationDone(i)).length;
  if(doneCount===STATIONS.length && !S.finale){ S.finale=true; save(); return go("finale"); }
  app.innerHTML = `<section class="hero"><h1>Hi, ${esc(S.name)}!</h1><p>You have <b style="color:var(--gold)">${doneCount} of ${STATIONS.length}</b> keys. Start with Lock 1 and work your way down. Tap any lock to begin or keep going.</p></section>${stdHTML()}${checkHTML()}
  ${GROUPS.map(G=>`<h2 class="grp">${G.title}</h2><p class="grp-note">${G.note}</p><div class="map">${STATIONS.map((s,i)=>{ if(s.g!==G.g) return ""; const d=stationDone(i); const started=s.qs.some((q,j)=>S.ans[qid(i,j)]); return `<button class="lock ${d?"done":""}" style="--c:${s.color}" data-st="${i}">
     ${d?`<span class="keyicon">${KEY_SVG("#c98f00")}</span>`:""}
     <span class="num">Lock ${i+1}</span><h3>${s.title}</h3><p>${s.blurb}</p>${s.std?`<span class="lockstd no-read">${s.std.join(" · ")}</span>`:""}
     <span class="status">${d?"Key earned ✓":started?"Keep going →":"Start →"}</span></button>`}).join("")}</div>`).join("")}
  ${doneCount===STATIONS.length?`<div class="nav"><button class="btn" id="toFinale">See my certificate 🎉</button></div>`:""}`;
  app.querySelectorAll(".lock").forEach(b=>b.addEventListener("click",()=>{ const st=+b.dataset.st; const steps=stepsFor(st); let resume=0; if(S.st===st && S.step) resume=S.step; go("station",st,Math.min(resume,steps.length-1)); }));
  const f=document.getElementById("toFinale"); if(f) f.onclick=()=>go("finale");
  wireChecks();
}

function passageHTML(s){
  if(s.passageHtml) return s.passageHtml;
  if(!s.passage) return "";
  return `<div class="passage"><div class="pt">${s.passage.title}</div>${s.passage.lines.map((l,k)=>`<p style="margin:0 0 8px"><b style="color:var(--muted)">${k+1}</b> ${l}</p>`).join("")}</div>`;
}

function renderStation(){
  const s = STATIONS[S.st], steps = stepsFor(S.st);
  if(S.step>=steps.length) S.step=steps.length-1;
  const step = steps[S.step];
  const pct = Math.round((S.step)/(steps.length-1)*100);
  let body="", canNext=true, label="";
  if(step.kind==="learn"){ const l=s.learn[step.i]; label="Learn it"; body=(step.i===0?stdBox(s):"")+`<h3>${l.h}</h3>${l.html}`; }
  else if(step.kind==="example"){ label="Try it together"; body=`<h3>Watch me unlock one</h3><p class="q">${s.example.q}</p><p>Think about it first. Then tap to check your thinking.</p><button class="btn dark no-read" id="reveal">Show the answer</button><div class="example-reveal" id="exAns" hidden><div class="feedback good"><b class="big">Here's how a locksmith thinks:</b>${s.example.a}</div></div>`; }
  else if(step.kind==="q"){ const q=s.qs[step.i]; label=q.t==="write"?"Write it":"Practice "+(step.i+1)+" of "+s.qs.length; body=questionHTML(s,q,step.i); canNext=!!(S.ans[qid(S.st,step.i)]&&S.ans[qid(S.st,step.i)].status); }
  else { label="Key unlocked"; body=doneHTML(s); }
  app.innerHTML = `<div class="station-head"><div><div class="eyebrow">Lock ${S.st+1} of ${STATIONS.length}</div><h2>${s.title}</h2></div><button class="btn ghost" id="toMap" style="color:#fff;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)">← Key map</button></div>
  <div class="progress" aria-label="Progress"><i style="width:${pct}%"></i></div>
  <article class="card" id="card" style="--c:${s.color}"><button class="speak no-read" id="speakBtn">🔊 Read to me</button><span class="step-tag no-read">${label}</span>${body}
  <div class="nav no-read"><button class="btn ghost" id="back" ${S.step===0?"disabled":""}>← Back</button>
  ${step.kind==="done"?`<button class="btn" id="next">${S.st<STATIONS.length-1?"Next lock →":"Finish 🎉"}</button>`:`<button class="btn" id="next" ${canNext?"":"disabled"}>Next →</button>`}</div></article>`;
  document.getElementById("toMap").onclick=()=>go("home");
  document.getElementById("speakBtn").onclick=()=>speak(document.getElementById("card"));
  document.getElementById("back").onclick=()=>go("station",S.st,S.step-1);
  document.getElementById("next").onclick=()=>{
    if(step.kind==="done"){ if(S.st<STATIONS.length-1) go("station",S.st+1,0); else go("finale"); }
    else go("station",S.st,S.step+1);
  };
  const r=document.getElementById("reveal"); if(r) r.onclick=()=>{ document.getElementById("exAns").hidden=false; r.hidden=true; popConfetti(); };
  if(step.kind==="q") wireQuestion(s,s.qs[step.i],step.i);
  if(step.kind==="done" && !S.celebrated[s.id]){ S.celebrated[s.id]=true; save(); setTimeout(bigConfetti,250); }
}

function doneHTML(s){
  const st=S.st; let right=0,total=0;
  s.qs.forEach((q,i)=>{ const a=S.ans[qid(st,i)]; if(q.t!=="write"){ total++; if(a&&(a.status==="right"||a.status==="second")) right++; } });
  const all = stationDone(st);
  if(!all) return `<div class="center"><h3>Almost there!</h3><p>You still have some practice to finish in this lock. Tap Back to find it.</p></div>`;
  return `<div class="center"><span class="bigkey">${KEY_SVG(s.color)}</span><h3>Key unlocked: ${s.title}!</h3>
  <p>Amazing work, ${esc(S.name)}! You got <b>${right} of ${total}</b> practice questions. Every key you earn makes you a stronger reader.</p>
  <p>${pick(["Your brain just grew a little bigger!","That's how real locksmiths work: one key at a time.","You should be proud of yourself!"])}</p></div>`;
}

/* ---------- question HTML ---------- */
function questionHTML(s,q,i){
  const a=S.ans[qid(S.st,i)]||{};
  let h = "";
  if(q.t==="tap"){ h+=`<div class="passage"><div class="pt">${s.passage.title}</div>${s.passage.lines.map((l,k)=>`<button class="tapline" data-k="${k}"><b style="color:var(--muted)">${k+1}</b> ${l}</button>`).join("")}</div>`; }
  else { if(q.passage) h+=`<div class="passage">${q.passage}</div>`; else if(s.passage||s.passageHtml) h+=passageHTML(s); }
  h+=`<span class="dok no-read">${q.d===1?"DOK 1 · Remember it":"DOK 2 · Use it"}</span><p class="q">${q.q}</p>`;
  if(q.t==="mc"){ h+=`<div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="ltr">${"ABCDE"[k]}</span><span>${o}</span></button>`).join("")}</div>`; }
  if(q.t==="multi"){ h+=`<p class="no-read" style="font-size:15px;color:var(--muted)">Tap every answer that fits, then tap Check.</p><div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}" aria-pressed="false"><span class="ltr">${"ABCDE"[k]}</span><span>${o}</span></button>`).join("")}</div><div class="nav no-read" style="justify-content:flex-start"><button class="btn dark" id="check">Check</button></div>`; }
  if(q.t==="order"){ h+=`<p class="no-read" style="font-size:15px;color:var(--muted)">Tap the cards in the correct order. Tap Start over to try again.</p><div class="order-ans" id="oAns"></div><div class="order-bank" id="oBank"></div><div class="nav no-read" style="justify-content:flex-start"><button class="btn dark" id="check">Check</button><button class="btn ghost" id="oReset">Start over</button></div>`; }
  if(q.t==="write"){ h+=`<div class="starters no-read">${q.starters.map(t=>`<button type="button" data-s="${esc(t)}">+ ${esc(t)}</button>`).join("")}</div>
   <textarea id="wbox" aria-label="Your answer" placeholder="Type or write with your Apple Pencil here…">${esc(a.text||"")}</textarea><div class="wc no-read" id="wc"></div>
   <div class="nav no-read" style="justify-content:flex-start"><button class="btn dark" id="submitW">Submit my writing</button></div>`; }
  h+=`<div id="fb"></div>`;
  return h;
}

function setAns(i,obj){ S.ans[qid(S.st,i)] = Object.assign(S.ans[qid(S.st,i)]||{},obj); save(); updateScore(); }
function enableNext(){ const n=document.getElementById("next"); if(n) n.disabled=false; }
function fb(kind,title,msg){ document.getElementById("fb").innerHTML=`<div class="feedback ${kind}"><b class="big">${title}</b>${msg}</div>`; }

function wireQuestion(s,q,i){
  const key=qid(S.st,i); const a=S.ans[key]||{};
  const finished = !!a.status;

  if(q.t==="mc"||q.t==="tap"){
    const sel = q.t==="mc"?".opt":".tapline";
    const btns=[...app.querySelectorAll(sel)];
    const show=()=>{ btns.forEach(b=>{ const k=+b.dataset.k; if(k===q.a) b.classList.add("right"); else if((a.wrong||[]).includes(k)) b.classList.add("wrong"); b.disabled=true; }); };
    (a.wrong||[]).forEach(k=>{ btns[k].classList.add("wrong"); btns[k].disabled=true; });
    if(finished){ show(); fb(a.status==="missed"?"miss":"good", a.status==="missed"?"Here's the key:":"You got it!", q.why); return; }
    btns.forEach(b=>b.addEventListener("click",()=>{
      const k=+b.dataset.k; const cur=S.ans[key]||{wrong:[]}; const wrong=cur.wrong||[];
      if(k===q.a){ setAns(i,{status:wrong.length?"second":"right",wrong}); a.wrong=wrong; show(); fb("good",pick(PRAISE)+" ✨",q.why); popConfetti(); toast(wrong.length?"+5 key points":"+10 key points"); enableNext(); }
      else{ wrong.push(k); a.wrong=wrong; b.classList.add("wrong"); b.disabled=true;
        if(wrong.length>=2){ setAns(i,{status:"missed",wrong}); show(); fb("miss","Good effort! Here's the key:",q.why+" <br><br>Now you know it for next time. Keep going!"); enableNext(); }
        else { setAns(i,{wrong}); fb("hint",pick(RETRY),"💡 Hint: "+q.hint); } }
    }));
  }

  if(q.t==="multi"){
    const btns=[...app.querySelectorAll(".opt")]; const chosen=new Set(a.picked||[]);
    const paint=()=>btns.forEach(b=>{ const on=chosen.has(+b.dataset.k); b.classList.toggle("sel",on); b.setAttribute("aria-pressed",on); });
    const reveal=()=>{ btns.forEach(b=>{ const k=+b.dataset.k; b.classList.remove("sel"); if(q.a.includes(k)) b.classList.add("right"); else if(chosen.has(k)) b.classList.add("wrong"); b.disabled=true; }); document.getElementById("check").hidden=true; };
    paint();
    if(finished){ reveal(); fb(a.status==="missed"?"miss":"good",a.status==="missed"?"Here's the key:":"You got it!",q.why); return; }
    btns.forEach(b=>b.addEventListener("click",()=>{ const k=+b.dataset.k; chosen.has(k)?chosen.delete(k):chosen.add(k); paint(); }));
    document.getElementById("check").onclick=()=>{
      if(!chosen.size){ toast("Pick at least one!"); return; }
      const ok = chosen.size===q.a.length && q.a.every(k=>chosen.has(k));
      const tries=(S.ans[key]&&S.ans[key].tries)||0;
      if(ok){ setAns(i,{status:tries?"second":"right",picked:[...chosen]}); reveal(); fb("good",pick(PRAISE)+" ✨",q.why); popConfetti(); toast(tries?"+5 key points":"+10 key points"); enableNext(); }
      else if(tries>=1){ setAns(i,{status:"missed",picked:[...chosen],tries:2}); reveal(); fb("miss","Good effort! Here's the key:",q.why); enableNext(); }
      else { setAns(i,{tries:1}); fb("hint",pick(RETRY),"💡 Hint: "+q.hint); }
    };
  }

  if(q.t==="order"){
    const bank=document.getElementById("oBank"), ans=document.getElementById("oAns");
    let order=[]; const shuffled=q.items.map((t,k)=>k).sort(()=>Math.random()-.5);
    if(shuffled.every((v,k)=>v===k)) shuffled.reverse();
    const draw=()=>{
      ans.innerHTML = order.length?order.map((k,n)=>`<div class="opt" style="cursor:default"><span class="ltr">${n+1}</span><span>${q.items[k]}</span></div>`).join(""):`<span style="color:var(--muted);padding:6px">Your order will appear here.</span>`;
      bank.innerHTML = shuffled.filter(k=>!order.includes(k)).map(k=>`<button class="opt" data-k="${k}"><span class="ltr">+</span><span>${q.items[k]}</span></button>`).join("");
      bank.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ order.push(+b.dataset.k); draw(); });
    };
    const final=()=>{ order=q.items.map((t,k)=>k); draw(); ans.querySelectorAll(".opt").forEach(e=>e.classList.add("right")); document.getElementById("check").hidden=true; document.getElementById("oReset").hidden=true; };
    if(finished){ final(); fb(a.status==="missed"?"miss":"good",a.status==="missed"?"Here's the correct order:":"You got it!",q.why); return; }
    draw();
    document.getElementById("oReset").onclick=()=>{ order=[]; draw(); };
    document.getElementById("check").onclick=()=>{
      if(order.length<q.items.length){ toast("Place every card first!"); return; }
      const ok=order.every((v,k)=>v===k); const tries=(S.ans[key]&&S.ans[key].tries)||0;
      if(ok){ setAns(i,{status:tries?"second":"right"}); final(); fb("good",pick(PRAISE)+" ✨",q.why); popConfetti(); toast(tries?"+5 key points":"+10 key points"); enableNext(); }
      else if(tries>=1){ setAns(i,{status:"missed",tries:2}); final(); fb("miss","Good effort! Here's the correct order:",q.why); enableNext(); }
      else { setAns(i,{tries:1}); order=[]; draw(); fb("hint",pick(RETRY),"💡 Hint: "+q.hint); }
    };
  }

  if(q.t==="write"){
    const box=document.getElementById("wbox"), wc=document.getElementById("wc");
    const count=()=>{ const n=(box.value.trim().match(/\S+/g)||[]).length; wc.textContent=n+" words · aim for at least 20 · saved on this iPad"; return n; };
    count();
    box.addEventListener("input",()=>{ setAns(i,{text:box.value}); count(); });
    app.querySelectorAll(".starters button").forEach(b=>b.onclick=()=>{ box.value=(box.value.trim()?box.value.trimEnd()+" ":"")+b.dataset.s+" "; box.focus(); setAns(i,{text:box.value}); count(); });
    const praise=()=>{ const txt=box.value.toLowerCase(); const hits=q.look.filter(w=>txt.includes(w)); const extra = hits.length>=2?"You used strong skill words like <b>"+hits.slice(0,3).join(", ")+"</b>. That shows real understanding!":"Nice job putting your thinking into words!";
      fb("good","Writing saved! "+pick(PRAISE)+" 📝",extra+`<div class="model"><b>Compare with a model answer:</b><br>${q.model}<br><br><i>Does your answer have the same key ideas? You can still add to yours above.</i></div>`); };
    if(finished){ praise(); }
    document.getElementById("submitW").onclick=()=>{
      const n=count();
      if(n<12){ fb("hint","Keep building!","Write a little more. Try using the sentence starters above. Aim for at least 20 words."); return; }
      const first=!S.ans[key].status; setAns(i,{status:"written",text:box.value}); praise(); if(first){ popConfetti(); toast("+10 key points"); } enableNext();
    };
  }
}

function renderFinale(){
  const rows = STATIONS.map((s,i)=>{ let r=0,t=0; s.qs.forEach((q,j)=>{ if(q.t!=="write"){t++; const a=S.ans[qid(i,j)]; if(a&&(a.status==="right"||a.status==="second"))r++;} }); return {s,r,t,done:stationDone(i)}; });
  const allDone = rows.every(x=>x.done);
  const date = new Date().toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});
  app.innerHTML = `<div class="card cert" style="--c:#f2b705">
   <span class="bigkey">${KEY_SVG("#c98f00")}</span>
   <h2>${allDone?PAGE.day+" Complete!":"Keep unlocking!"}</h2>
   <p>${allDone?"This certifies that":"You're doing great,"}</p>
   <div class="who">${esc(S.name)}</div>
   <p>${allDone?"unlocked all "+STATIONS.length+" locks of "+PAGE.title+" "+PAGE.day+" with "+points()+" key points.":"Finish the rest of the locks to earn your certificate."}</p>
   <p style="color:var(--muted)">${date}</p>
   <div class="tally">${rows.map(x=>`<div><b>${x.s.title}</b><br>${x.done?x.r+" / "+x.t+" correct ✓":"not finished yet"}</div>`).join("")}</div>
   <p class="no-read">Show this screen to your teacher, or tap Copy my results to paste them into Canvas.</p>
   <div class="nav" style="justify-content:center"><button class="btn" id="copyRes">Copy my results</button><button class="btn ghost" id="toMap2">← Key map</button></div>
  </div>`;
  if(allDone){ setTimeout(bigConfetti,200); setTimeout(bigConfetti,1600); toast("You did it, "+S.name+"! 🎉"); }
  document.getElementById("toMap2").onclick=()=>go("home");
  document.getElementById("copyRes").onclick=()=>{
    let txt=`${PAGE.title} ${PAGE.day} – ${S.name} – ${date}\nKey points: ${points()}\n\n`;
    rows.forEach((x,i)=>{ txt+=`${x.s.title}: ${x.done?x.r+"/"+x.t+" correct":"not finished"}\n`; x.s.qs.forEach((q,j)=>{ if(q.t==="write"){ const a=S.ans[qid(i,j)]; txt+=`  Writing: ${a&&a.text?a.text.trim():"(blank)"}\n`; } }); });
    navigator.clipboard.writeText(txt).then(()=>toast("Copied! Paste it in Canvas.")).catch(()=>{ const ta=document.createElement("textarea"); ta.value=txt; ta.style.width="100%"; ta.rows=8; document.querySelector(".cert").appendChild(ta); ta.select(); toast("Select all and copy the box below."); });
  };
}

render();
</script>

</body></html>
